name: 🐛 Bug report
description: Report a problem using the required template.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting

        **You must follow this template and complete every required field. Issues that do not follow the template may receive no response.**

        **Be kind and polite. Treat maintainers and other contributors with respect.**
  - type: checkboxes
    id: requirements
    attributes:
      label: Submission requirements
      options:
        - label: I have followed the template and completed all required fields.
          required: true
        - label: I agree to be kind and polite.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem, including any relevant error messages.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the steps and a minimal code example needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other useful details, such as your TabFORGE version, environment, or screenshots.
